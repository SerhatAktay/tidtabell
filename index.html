<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avgångar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #0A0A0A;
      --paper: #F5F4EF;
      --dim:   #777;
      --rule:  #C8C7C2;
    }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      background: var(--ink);
      color: var(--paper);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .h-left { display: flex; align-items: center; gap: 18px; }
    .h-right { display: flex; align-items: center; gap: 18px; }

    #backBtn {
      display: none;
      background: none; border: none;
      color: var(--paper);
      font-size: 32px; font-weight: 200;
      line-height: 1; cursor: pointer;
      opacity: 0.7; transition: opacity 0.2s;
      padding: 0 4px 0 0;
    }
    #backBtn.visible { display: block; }
    #backBtn:hover { opacity: 1; }

    #clock {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .search-btn {
      background: none; border: none;
      color: var(--paper);
      cursor: pointer; opacity: 0.7;
      display: flex; align-items: center;
      transition: opacity 0.2s; padding: 0;
    }
    .search-btn:hover { opacity: 1; }

    .refresh-dot { cursor: pointer; opacity: 0.7; transition: opacity 0.2s; flex-shrink: 0; }
    .refresh-dot:hover { opacity: 1; }

    /* ── Shared page wrapper ────────────────────────────────── */
    .page {
      flex: 1;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .page.hidden { display: none; }

    @media (max-width: 600px) {
      .page { padding: 16px; gap: 20px; }
      header { padding: 12px 16px; }
      #clock { font-size: 22px; }
    }

    /* ── Board ──────────────────────────────────────────────── */
    .board { border: 2px solid var(--ink); }

    .board-head {
      border-bottom: 2px solid var(--ink);
      padding: 10px 20px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .board-name { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .board-sub  { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); }
    .board-walk { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); }

    /* ── Departure table ────────────────────────────────────── */
    .dep-table { width: 100%; border-collapse: collapse; }
    .dep-table tr { border-bottom: 1px solid var(--rule); }
    .dep-table tr:last-child { border-bottom: none; }
    .dep-table td { padding: 13px 20px; vertical-align: middle; }

    .col-line { width: 68px; }
    .col-time { width: 128px; text-align: right; white-space: nowrap; position: relative; }

    .line-num {
      display: inline-block;
      background: var(--ink); color: var(--paper);
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      min-width: 44px; text-align: center;
    }

    .dest-text { font-size: 15px; font-weight: 400; }

    .mode-icon {
      display: inline-flex;
      vertical-align: middle;
      margin-right: 8px;
      opacity: 0.65;
      transform: translateY(-1px);
    }

    .dep-time { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .dep-time.now  { background: var(--ink); color: var(--paper); padding: 2px 6px; font-size: 13px; letter-spacing: 1px; }
    .dep-time.soon { font-weight: 900; }
    .dep-time.cancel { font-size: 12px; font-weight: 400; text-decoration: line-through; color: var(--dim); letter-spacing: 0.5px; }

    /* ── Delay delta + reason popover ──────────────────────────── */
    .dep-delta {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
    }
    button.dep-delta {
      background: none; border: none;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    button.dep-delta:hover { color: var(--ink); }

    .popover {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      width: 220px;
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 10px 12px;
      text-align: left;
      white-space: normal;
      z-index: 20;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    }
    .popover.open { display: block; }
    .alert-item + .alert-item { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); }
    .alert-title { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 3px; }
    .alert-text  { font-size: 12px; line-height: 1.4; color: var(--ink); }

    /* ── State / loading ────────────────────────────────────── */
    .state-msg {
      padding: 28px 20px; text-align: center;
      font-size: 12px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--dim);
    }
    .dot-anim::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots {
      0%   { content: ''; }   25%  { content: '.'; }
      50%  { content: '..'; } 75%  { content: '...'; }
    }

    /* ── Search input ───────────────────────────────────────── */
    .search-field {
      border: 2px solid var(--ink);
      display: flex; align-items: center;
    }

    #searchInput {
      flex: 1;
      border: none; outline: none;
      background: var(--paper); color: var(--ink);
      font-family: inherit;
      font-size: 20px; font-weight: 300;
      letter-spacing: 0.5px;
      padding: 14px 20px;
    }

    /* ── Search results list ────────────────────────────────── */
    .result-item {
      border: 2px solid var(--ink);
      border-top: none;
      padding: 12px 20px;
      cursor: pointer;
      display: flex; align-items: baseline; gap: 14px;
      transition: background 0.12s, color 0.12s;
    }
    .result-item:hover { background: var(--ink); color: var(--paper); }
    .result-item:hover .result-sub { color: var(--rule); }

    .result-name { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .result-sub  { font-size: 11px; letter-spacing: 0.5px; color: var(--dim); }

  </style>
</head>
<body>

<header>
  <div class="h-left">
    <button id="backBtn" onclick="goBack()">‹</button>
    <span id="clock"></span>
  </div>
  <div class="h-right">
    <button class="search-btn" id="searchBtn" onclick="showSearch()" title="Sök hållplats">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="8.5" cy="8.5" r="5.5"/>
        <line x1="12.5" y1="12.5" x2="18" y2="18"/>
      </svg>
    </button>
    <svg class="refresh-dot" width="20" height="20" viewBox="0 0 20 20" style="cursor:default">
      <circle cx="10" cy="10" r="7" fill="none" stroke="rgba(245,244,239,0.25)" stroke-width="1.5"/>
      <circle id="progressArc" cx="10" cy="10" r="7" fill="none" stroke="rgba(245,244,239,0.9)" stroke-width="1.5"
              stroke-dasharray="43.98" stroke-dashoffset="0"
              transform="rotate(-90 10 10)" style="transition: stroke-dashoffset 1s linear;"/>
    </svg>
  </div>
</header>

<!-- ── Main view ─────────────────────────────────────────────── -->
<div class="page" id="mainView">

  <div class="board">
    <div class="board-head">
      <div style="display:flex;align-items:baseline;gap:16px">
        <span class="board-name">Vasalund</span>
        <span class="board-sub">Buss</span>
        <span class="board-walk" id="walkVasalund"></span>
      </div>
    </div>
    <div id="busBoard"><div class="state-msg"><span class="dot-anim">Hämtar</span></div></div>
  </div>

  <div class="board">
    <div class="board-head">
      <div style="display:flex;align-items:baseline;gap:16px">
        <span class="board-name">Solna station</span>
        <span class="board-sub">Pendeltåg</span>
        <span class="board-walk" id="walkSolna"></span>
      </div>
    </div>
    <div id="trainBoard"><div class="state-msg"><span class="dot-anim">Hämtar</span></div></div>
  </div>

  <div class="board">
    <div class="board-head">
      <div style="display:flex;align-items:baseline;gap:16px">
        <span class="board-name">Solna centrum</span>
        <span class="board-sub">T-bana</span>
        <span class="board-walk" id="walkSolnaC"></span>
      </div>
    </div>
    <div id="metroBoard"><div class="state-msg"><span class="dot-anim">Hämtar</span></div></div>
  </div>

</div>

<!-- ── Search view ───────────────────────────────────────────── -->
<div class="page hidden" id="searchView">
  <div class="search-field">
    <input type="text" id="searchInput" placeholder="Sök hållplats…" autocomplete="off" oninput="onSearchInput()">
  </div>
  <div id="searchResults"></div>
  <div id="stopBoard"></div>
</div>


<script>
// ── Config ────────────────────────────────────────────────────────────────
// After deploying worker.js to Cloudflare, paste your worker URL here:
const PROXY_BASE  = 'https://tidtabell.serhat-fd0.workers.dev';

const VASALUND_ID = '740066635';
const SOLNA_ID    = '740000759';
const SOLNA_C_ID  = '740021642';
const WALK        = { vasalund: 3, solna: 10, solnac: 14 };
const REFRESH_SEC = 30;
const MAX_ROWS    = 4;

let countdown    = REFRESH_SEC;
let timer        = null;
let searchTimer  = null;

// ── Clock ─────────────────────────────────────────────────────────────────
function tickClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(tickClock, 1000);
tickClock();

// ── API (all calls go through the Cloudflare proxy) ──────────────────────
async function fetchDepartures(stopId) {
  const r = await fetch(`${PROXY_BASE}/departures/${stopId}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d.departures || [];
}

async function searchStops(query) {
  const r = await fetch(`${PROXY_BASE}/stops/name/${encodeURIComponent(query)}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  return (d.stop_groups || []).map(g => ({ extId: g.id, name: g.name }));
}

// ── Time helper ───────────────────────────────────────────────────────────
function calcDisplay(dep) {
  if (dep.canceled) return { text: 'Inställd', cls: 'cancel' };
  const dt   = new Date(dep.realtime || dep.scheduled);
  const mins = Math.round((dt - new Date()) / 60000);
  if (mins <= 0)  return { text: 'Nu',          cls: 'now'  };
  if (mins <= 2)  return { text: mins + ' min', cls: 'soon' };
  if (mins <= 59) return { text: mins + ' min', cls: ''     };
  return { text: dt.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }), cls: '' };
}

// ── Transport mode icons ───────────────────────────────────────────────────
const MODE_ICONS = {
  BUS: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="14" height="10" rx="2"/>
    <line x1="3" y1="8.5" x2="17" y2="8.5"/>
    <circle cx="6.5" cy="16" r="1.3"/>
    <circle cx="13.5" cy="16" r="1.3"/>
  </svg>`,
  TRAIN: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14 V6 a3 3 0 0 1 3-3 h6 a3 3 0 0 1 3 3 v8 z"/>
    <line x1="4" y1="9" x2="16" y2="9"/>
    <circle cx="7" cy="16.3" r="1.2"/>
    <circle cx="13" cy="16.3" r="1.2"/>
  </svg>`,
  METRO: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="14" height="10" rx="1"/>
    <rect x="5" y="5.5" width="3" height="3" rx="0.5"/>
    <rect x="8.5" y="5.5" width="3" height="3" rx="0.5"/>
    <rect x="12" y="5.5" width="3" height="3" rx="0.5"/>
    <circle cx="6.5" cy="16" r="1.2"/>
    <circle cx="13.5" cy="16" r="1.2"/>
  </svg>`,
  TRAM: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="1" x2="16" y2="1"/>
    <line x1="10" y1="1" x2="10" y2="3.5"/>
    <rect x="3" y="3.5" width="14" height="10" rx="1.5"/>
    <line x1="3" y1="8.5" x2="17" y2="8.5"/>
    <circle cx="6.5" cy="16.3" r="1.2"/>
    <circle cx="13.5" cy="16.3" r="1.2"/>
  </svg>`,
  BOAT: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12 L5 16 H15 L17 12 Z"/>
    <line x1="10" y1="12" x2="10" y2="3"/>
    <path d="M10 4 L15 8 H10 Z"/>
  </svg>`,
  TAXI: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="3" width="4" height="2" rx="0.5"/>
    <path d="M3 13 v-2.5 a1 1 0 0 1 .8-1 L6 8.5 h8 l2.2 1.5 a1 1 0 0 1 .8 1 V13 z"/>
    <circle cx="6.5" cy="14.5" r="1.3"/>
    <circle cx="13.5" cy="14.5" r="1.3"/>
  </svg>`,
};
function modeIcon(mode) {
  return MODE_ICONS[mode] || '';
}

// ── Delay delta + reason popover ───────────────────────────────────────────
function deltaInfo(dep) {
  if (dep.canceled || !dep.is_realtime) return null;
  const sec = dep.delay || 0;
  if (Math.abs(sec) < 60) return null;
  const mins = Math.round(sec / 60);
  return (mins > 0 ? '+' : '') + mins + ' min';
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderAlerts(alerts) {
  return alerts.map(a => `
    <div class="alert-item">
      <div class="alert-title">${escapeHtml(a.title || 'Avvikelse')}</div>
      <div class="alert-text">${escapeHtml(a.text || '')}</div>
    </div>`).join('');
}

let popoverSeq = 0;

function toggleAlert(evt, id) {
  evt.stopPropagation();
  const el = document.getElementById(id);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  closeAllPopovers();
  if (!wasOpen) el.classList.add('open');
}

function closeAllPopovers() {
  document.querySelectorAll('.popover.open').forEach(p => p.classList.remove('open'));
}
document.addEventListener('click', closeAllPopovers);

// ── Destination cleanup ───────────────────────────────────────────────────
function cleanDest(str = '') {
  return str
    .replace(/\s*\([^)]*\)/g, '')
    .replace(/ T-bana$/i, '')
    .replace(/ station$/i, '')
    .replace(/centralstation$/i, 'C')
    .replace(/ postterminal$/i, '')
    .trim();
}

// ── Build departure table ─────────────────────────────────────────────────
function buildTable(rows, max) {
  if (!rows.length) return '<div class="state-msg">Inga avgångar</div>';
  const lim  = max || MAX_ROWS;
  const body = rows.slice(0, lim).map(([num, dest, dep]) => {
    const { text, cls } = calcDisplay(dep);
    const icon  = modeIcon(dep.route?.transport_mode);
    const delta = deltaInfo(dep);

    let deltaHtml = '';
    if (delta) {
      const alerts = dep.alerts || [];
      if (alerts.length) {
        const id = `pop-${++popoverSeq}`;
        deltaHtml = `<button type="button" class="dep-delta" onclick="toggleAlert(event, '${id}')">${delta}</button>
          <div class="popover" id="${id}">${renderAlerts(alerts)}</div>`;
      } else {
        deltaHtml = `<span class="dep-delta">${delta}</span>`;
      }
    }

    return `<tr>
      <td class="col-line"><span class="line-num">${num}</span></td>
      <td><span class="mode-icon">${icon}</span><span class="dest-text">${dest}</span></td>
      <td class="col-time"><span class="dep-time ${cls}">${text}</span>${deltaHtml}</td>
    </tr>`;
  }).join('');
  return `<table class="dep-table"><tbody>${body}</tbody></table>`;
}

// ── Home board filters ────────────────────────────────────────────────────
function busFilter(dep) {
  const dir = dep.route?.direction || '';
  const num = dep.route?.designation || '';
  return dir.includes('Odenplan') || dir.includes('Sundbyberg') ||
         (num === '509' && dir.includes('Tomteboda'));
}

function trainDest(dep) {
  const dir = dep.route?.direction || '';
  if (dir.includes('Uppsala') || dir.includes('Gävle'))  return 'Uppsala';
  if (dir.includes('Märsta') || dir.includes('Arlanda')) return 'Märsta';
  return 'Stockholm C';
}

// ── Fetch home boards ─────────────────────────────────────────────────────
function fetchAll() {
  fetchDepartures(VASALUND_ID).then(deps => {
    const rows = deps
      .filter(d => d.route?.transport_mode === 'BUS' && busFilter(d))
      .map(d => {
        const num  = d.route.designation;
        const dest = (num === '509' && (d.route.direction||'').includes('Tomteboda')) ? 'Solna C' : cleanDest(d.route.direction);
        return [num, dest, d];
      });
    document.getElementById('busBoard').innerHTML = buildTable(rows);
  }).catch(e => {
    document.getElementById('busBoard').innerHTML = `<div class="state-msg">⚠ ${e.message}</div>`;
  });

  fetchDepartures(SOLNA_ID).then(deps => {
    const rows = deps
      .filter(d => d.route?.transport_mode === 'TRAIN')
      .map(d => [d.route.designation, trainDest(d), d]);
    document.getElementById('trainBoard').innerHTML = buildTable(rows);
  }).catch(e => {
    document.getElementById('trainBoard').innerHTML = `<div class="state-msg">⚠ ${e.message}</div>`;
  });

  fetchDepartures(SOLNA_C_ID).then(deps => {
    const rows = deps
      .filter(d => d.route?.transport_mode === 'METRO')
      .map(d => [d.route.designation, cleanDest(d.route.direction), d]);
    document.getElementById('metroBoard').innerHTML = buildTable(rows);
  }).catch(e => {
    document.getElementById('metroBoard').innerHTML = `<div class="state-msg">⚠ ${e.message}</div>`;
  });

  startCountdown();
}

// ── Countdown / arc ───────────────────────────────────────────────────────
const CIRC = 43.98;

function startCountdown() {
  clearInterval(timer);
  countdown = REFRESH_SEC;
  updateArc();
  timer = setInterval(() => {
    countdown--;
    updateArc();
    if (countdown <= 0) { clearInterval(timer); fetchAll(); }
  }, 1000);
}
function updateArc() {
  document.getElementById('progressArc').style.strokeDashoffset =
    CIRC * (1 - countdown / REFRESH_SEC);
}

// ── View switching ────────────────────────────────────────────────────────
function showSearch() {
  document.getElementById('mainView').classList.add('hidden');
  document.getElementById('searchView').classList.remove('hidden');
  document.getElementById('backBtn').classList.add('visible');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('stopBoard').innerHTML = '';
  document.getElementById('searchInput').focus();
}

function goBack() {
  document.getElementById('searchView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  document.getElementById('backBtn').classList.remove('visible');
}

// ── Stop search ───────────────────────────────────────────────────────────
function onSearchInput() {
  clearTimeout(searchTimer);
  const q = document.getElementById('searchInput').value.trim();
  document.getElementById('stopBoard').innerHTML = '';
  if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
  document.getElementById('searchResults').innerHTML =
    '<div class="state-msg"><span class="dot-anim">Söker</span></div>';
  searchTimer = setTimeout(() => doSearch(q), 380);
}

async function doSearch(q) {
  try {
    const stops = await searchStops(q);
    if (!stops.length) {
      document.getElementById('searchResults').innerHTML =
        '<div class="state-msg">Inga hållplatser hittades</div>';
      return;
    }
    document.getElementById('searchResults').innerHTML = stops.map(s => `
      <div class="result-item" onclick="showStopDepartures('${s.extId}', '${s.name.replace(/'/g,"\\'")}')">
        <span class="result-name">${s.name}</span>
        <span class="result-sub">${s.extId}</span>
      </div>`).join('');
  } catch(e) {
    document.getElementById('searchResults').innerHTML =
      `<div class="state-msg">⚠ ${e.message}</div>`;
  }
}

// ── Departures for searched stop ──────────────────────────────────────────
async function showStopDepartures(extId, name) {
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('stopBoard').innerHTML = `
    <div class="board">
      <div class="board-head">
        <span class="board-name">${name}</span>
      </div>
      <div id="dynBoard"><div class="state-msg"><span class="dot-anim">Hämtar</span></div></div>
    </div>`;

  try {
    const deps = await fetchDepartures(extId);
    const rows = deps.map(d => [
      d.route?.designation || '?',
      cleanDest(d.route?.direction),
      d
    ]);
    document.getElementById('dynBoard').innerHTML = buildTable(rows, 8);
  } catch(e) {
    document.getElementById('dynBoard').innerHTML = `<div class="state-msg">⚠ ${e.message}</div>`;
  }
}
