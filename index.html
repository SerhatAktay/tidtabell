<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avgångar</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <meta name="theme-color" content="#0A0A0A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Avgångar">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #0A0A0A;
      --paper: #F5F4EF;
      --dim:   #5c5c5c;
      --rule:  #C8C7C2;
    }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      background: var(--ink);
      color: var(--paper);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .h-left { display: flex; align-items: center; gap: 18px; }
    .h-right { display: flex; align-items: center; gap: 18px; }

    #backBtn {
      display: none;
      background: none; border: none;
      color: var(--paper);
      font-size: 32px; font-weight: 200;
      line-height: 1; cursor: pointer;
      opacity: 0.7; transition: opacity 0.2s;
      padding: 0 4px 0 0;
    }
    #backBtn.visible { display: block; }
    #backBtn:hover { opacity: 1; }

    #clock {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .search-btn {
      background: none; border: none;
      color: var(--paper);
      cursor: pointer; opacity: 0.7;
      display: flex; align-items: center;
      transition: opacity 0.2s; padding: 0;
    }
    .search-btn:hover { opacity: 1; }

    .refresh-dot { flex-shrink: 0; }

    :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    header :focus-visible { outline-color: var(--paper); }
    @media (prefers-reduced-motion: reduce) {
      .dot-anim::after { animation: none; content: '…'; }
      #progressArc { transition: none !important; }
    }

    /* ── Shared page wrapper ────────────────────────────────── */
    .page {
      flex: 1;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .page.hidden { display: none; }

    @media (min-width: 1000px) {
      /* Needed because .page.hidden's `display: none` (0 IDs, 2 classes)
         loses to #mainView's `display: grid` below (1 ID always outranks
         any number of classes) — without this override the boards stay
         visible behind the search view at this width. */
      #mainView.hidden { display: none; }
      #mainView { max-width: 1400px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
    }

    @media (max-width: 600px) {
      .page { padding: 16px; gap: 20px; }
      header { padding: 12px 16px; }
      #clock { font-size: 22px; }
      .dep-table td { padding: 13px 12px; }
      .col-line { width: 54px; }
      .col-time { width: 88px; }
      .line-num { min-width: 34px; padding: 3px 6px; font-size: 12px; }
      .mode-icon { margin-right: 6px; }
    }

    /* ── Board ──────────────────────────────────────────────── */
    .board { border: 2px solid var(--ink); }

    .board-head {
      border-bottom: 2px solid var(--ink);
      padding: 10px 20px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    /* Home boards: header is a button that collapses the board. */
    button.board-head {
      width: 100%; background: none; border-top: none; border-left: none; border-right: none;
      font: inherit; color: inherit; text-align: left; cursor: pointer;
    }
    .board-titles { display: flex; align-items: baseline; gap: 16px; }
    .board-chev { transition: transform 0.15s; font-size: 12px; }
    .board.collapsed .board-chev { transform: rotate(-90deg); }
    .board.collapsed .board-head { border-bottom: none; }
    .board.collapsed > :not(.board-head) { display: none; }

    .board-name { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .board-sub  { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); }

    /* ── Departure table ────────────────────────────────────── */
    .dep-table { width: 100%; border-collapse: collapse; }
    .dep-table tr { border-bottom: 1px solid var(--rule); }
    .dep-table tr:last-child { border-bottom: none; }
    .dep-table td { padding: 13px 20px; vertical-align: middle; }

    .col-line { width: 68px; }
    .dep-table td.col-line { padding-right: 0; }
    .col-time { width: 128px; text-align: right; white-space: nowrap; position: relative; }

    .line-num {
      display: inline-block;
      background: var(--ink); color: var(--paper);
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      min-width: 44px; text-align: center;
    }

    .dest-text { font-size: 15px; font-weight: 400; }

    .mode-icon {
      display: inline-flex;
      vertical-align: middle;
      margin-right: 8px;
      opacity: 0.85;
      transform: translateY(-1px);
    }
    .mode-icon svg { width: 16px; height: 16px; }

    .dest-wrap { display: inline-block; vertical-align: middle; }

    .dep-platform {
      display: inline-block;
      margin-left: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--dim);
      border: 1px solid var(--rule);
      padding: 1px 5px;
      vertical-align: middle;
    }

    .dep-last {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--dim);
    }

    /* ── Leave-now highlight (home boards only) ────────────────── */
    .dep-table tr.row-next { background: rgba(10,10,10,0.05); box-shadow: inset 4px 0 0 var(--ink); }
    .dep-table tr.row-cancel { opacity: 0.5; }

    .dep-time { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .dep-time.now  { background: var(--ink); color: var(--paper); padding: 2px 6px; font-size: 13px; letter-spacing: 1px; }
    .dep-time.soon { font-weight: 900; }
    .dep-time.cancel { font-size: 12px; font-weight: 400; text-decoration: line-through; color: var(--dim); letter-spacing: 0.5px; }

    /* ── Delay delta + reason popover ──────────────────────────── */
    .dep-delta {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    button.dep-delta {
      width: 100%; text-align: right;
      background: none; border: none;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    button.dep-delta:hover { color: var(--ink); }

    .popover {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      width: 220px;
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 10px 12px;
      text-align: left;
      white-space: normal;
      z-index: 20;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    }
    .popover.open { display: block; }
    .alert-item + .alert-item { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule); }
    .alert-title { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 3px; }
    .alert-text  { font-size: 12px; line-height: 1.4; color: var(--ink); }

    /* ── State / loading ────────────────────────────────────── */
    tr[data-stop] { cursor: pointer; }
    tr[data-stop]:hover { background: rgba(10,10,10,0.03); }

    /* ── Map sheet ──────────────────────────────────────────── */
    .map-sheet {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      background: var(--paper);
    }
    .map-sheet[hidden] { display: none; }
    .map-head {
      background: var(--ink); color: var(--paper);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-shrink: 0;
    }
    .map-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .map-title .line-num { background: var(--paper); color: var(--ink); flex-shrink: 0; }
    #mapDest { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mapClose {
      background: none; border: none; color: var(--paper);
      font-size: 32px; font-weight: 200; line-height: 1; cursor: pointer; padding: 0 4px;
    }
    #map { flex: 1; min-height: 0; }
    .map-msg {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
      padding: 12px 16px; text-align: center;
      font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
      background: var(--paper); border-top: 2px solid var(--ink);
    }
    .map-msg:empty { display: none; }

    .stale { opacity: 0.45; }
    .stale-note {
      padding: 8px 20px; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--dim);
      border-bottom: 1px solid var(--rule);
    }
    .state-msg {
      padding: 28px 20px; text-align: center;
      font-size: 12px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--dim);
    }
    .dot-anim::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots {
      0%   { content: ''; }   25%  { content: '.'; }
      50%  { content: '..'; } 75%  { content: '...'; }
    }

    /* ── Search input ───────────────────────────────────────── */
    .search-field {
      border: 2px solid var(--ink);
      display: flex; align-items: center;
    }

    /* ── Nearby-stops trigger / update-location link ──────────── */
    .nearby-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      border: 2px solid var(--ink);
      border-top: none;
      background: none;
      padding: 12px 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--ink);
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }
    .nearby-btn:hover { background: var(--ink); color: var(--paper); }
    .nearby-btn svg { flex-shrink: 0; }

    #clearBtn {
      background: none; border: none; cursor: pointer;
      color: var(--dim); font-size: 26px; font-weight: 200;
      line-height: 1; padding: 0 18px;
    }
    #clearBtn:hover { color: var(--ink); }
    #clearBtn[hidden] { display: none; }

    #searchInput {
      flex: 1; min-width: 0;
      border: none; outline: none;
      background: var(--paper); color: var(--ink);
      font-family: inherit;
      font-size: 20px; font-weight: 300;
      letter-spacing: 0.5px;
      padding: 14px 20px;
    }

    /* ── Search results list ────────────────────────────────── */
    .result-item {
      width: 100%; background: none; font: inherit; color: inherit; text-align: left;
      border: 2px solid var(--ink);
      border-top: none;
      padding: 12px 20px;
      cursor: pointer;
      display: flex; align-items: baseline; gap: 14px;
      transition: background 0.12s, color 0.12s;
    }
    .result-item:hover { background: var(--ink); color: var(--paper); }
    .result-item:hover .result-sub { color: var(--rule); }

    .result-name { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .result-sub  { font-size: 11px; letter-spacing: 0.5px; color: var(--dim); }

    .recents-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--dim);
      margin-bottom: 6px;
    }

    /* Results/recents/nearby lists render inside #searchResults, separated
       from the search field above by the page's flex gap — without this,
       the list has no visible top edge. */
    #nearbyTrigger { border-top: 2px solid var(--ink); }

    /* Closes the top of a results/recents/nearby list. Excludes
       .recents-label so the border lands on the first real row, not
       on the label text above it (which isn't itself bordered). */
    #searchResults > *:first-child:not(.recents-label),
    .recents-label + .result-item,
    .recents-label + .nearby-btn {
      border-top: 2px solid var(--ink);
    }

  </style>
</head>
<body>

<header>
  <div class="h-left">
    <button id="backBtn" onclick="goBack()" aria-label="Tillbaka">‹</button>
    <span id="clock"></span>
  </div>
  <div class="h-right">
    <button class="search-btn" id="searchBtn" onclick="showSearch()" title="Sök hållplats" aria-label="Sök hållplats">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="5.5"/>
        <line x1="12.5" y1="12.5" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="search-btn" id="refreshBtn" onclick="fetchAll()" title="Uppdatera" aria-label="Uppdatera">
    <svg class="refresh-dot" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="7" fill="none" stroke="rgba(245,244,239,0.25)" stroke-width="1.5"/>
      <circle id="progressArc" cx="10" cy="10" r="7" fill="none" stroke="rgba(245,244,239,0.9)" stroke-width="1.5"
              stroke-dasharray="43.98" stroke-dashoffset="0"
              transform="rotate(-90 10 10)" style="transition: stroke-dashoffset 1s linear;"/>
    </svg>
    </button>
  </div>
</header>

<!-- ── Main view ─────────────────────────────────────────────── -->
<div class="page" id="mainView">

  <div class="board">
    <button type="button" class="board-head" data-board="busBoard" aria-expanded="true">
      <span class="board-titles">
        <span class="board-name">Vasalund</span>
        <span class="board-sub">Buss</span>
      </span>
      <span class="board-chev" aria-hidden="true">▾</span>
    </button>
    <div id="busBoard"><div class="state-msg"><span class="dot-anim">Hämtar</span></div></div>
  </div>

  <div class="board">
    <button type="button" class="board-head" data-board="trainBoard" aria-expanded="true">
      <span class="board-titles">
        <span class="board-name">Solna station</span>
        <span class="board-sub">Pendeltåg</span>
      </span>
      <span class="board-chev" aria-hidden="true">▾</span>
    </button>
    <div id="trainBoard"><div class="state-msg"><span class="dot-anim">Hämtar</span></div></div>
  </div>

  <div class="board">
    <button type="button" class="board-head" data-board="metroBoard" aria-expanded="true">
      <span class="board-titles">
        <span class="board-name">Solna centrum</span>
        <span class="board-sub">T-bana</span>
      </span>
      <span class="board-chev" aria-hidden="true">▾</span>
    </button>
    <div id="metroBoard"><div class="state-msg"><span class="dot-anim">Hämtar</span></div></div>
  </div>

</div>

<!-- ── Search view ───────────────────────────────────────────── -->
<div class="page hidden" id="searchView">
  <div class="search-field">
    <input type="text" id="searchInput" placeholder="Sök hållplats…" aria-label="Sök hållplats" autocomplete="off" oninput="onSearchInput()">
    <button type="button" id="clearBtn" hidden aria-label="Rensa" onclick="clearSearch()">×</button>
  </div>
  <button type="button" class="nearby-btn" id="nearbyTrigger" onclick="findNearby()">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 18 C10 18 16 12.5 16 8 a6 6 0 1 0 -12 0 C4 12.5 10 18 10 18 Z"/>
      <circle cx="10" cy="8" r="2.2"/>
    </svg>
    <span>Hållplatser nära dig</span>
  </button>
  <div id="searchResults"></div>
  <div id="stopBoard"></div>
</div>


<!-- ── Map sheet ─────────────────────────────────────────────── -->
<div class="map-sheet" id="mapSheet" hidden role="dialog" aria-modal="true" aria-label="Rutt på karta">
  <div class="map-head">
    <div class="map-title"><span class="line-num" id="mapLine"></span><span id="mapDest"></span></div>
    <button type="button" id="mapClose" aria-label="Stäng" onclick="history.back()">×</button>
  </div>
  <div id="map"></div>
  <div class="map-msg" id="mapMsg" role="status"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
// After deploying worker.js to Cloudflare, paste your worker URL here:
const PROXY_BASE  = 'https://tidtabell.serhat-fd0.workers.dev';

const VASALUND_ID = '740066635';
const SOLNA_ID    = '740000759';
const SOLNA_C_ID  = '740021642';
const WALK        = { vasalund: 3, solna: 10, solnac: 14 };
const REFRESH_SEC  = 30;
const MAX_ROWS     = 4;
const MAX_PER_LINE = 2;  // cap repeats of the same line+destination on a board

let countdown    = REFRESH_SEC;
let timer        = null;
let searchTimer  = null;

// ── Clock ─────────────────────────────────────────────────────────────────
function tickClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(tickClock, 1000);
tickClock();

// ── API (all calls go through the Cloudflare proxy) ──────────────────────
// time (optional): 'YYYY-MM-DDTHH:mm' local time — the Trafiklab endpoint's
// window is a fixed, non-configurable 60 minutes from this point (or from
// now, if omitted). Used to look further ahead when a board is sparse.
async function fetchDepartures(stopId, time) {
  const path = time ? `/departures/${stopId}/${time}` : `/departures/${stopId}`;
  const r = await fetch(`${PROXY_BASE}${path}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d.departures || [];
}

async function searchStops(query) {
  const r = await fetch(`${PROXY_BASE}/stops/name/${encodeURIComponent(query)}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  return (d.stop_groups || []).map(g => ({ extId: g.id, name: g.name }));
}

async function fetchNearby(lat, lon, radius, maxNo = 10) {
  const r = await fetch(`${PROXY_BASE}/nearbystops?originCoordLat=${lat}&originCoordLong=${lon}&r=${radius}&maxNo=${maxNo}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  if (d.errorCode) throw new Error(d.errorText || `Felkod ${d.errorCode}`);
  return (d.stopLocationOrCoordLocation || [])
    .map(s => s.StopLocation)
    .filter(Boolean)
    .map(s => ({ extId: s.extId, name: s.name, dist: s.dist }));
}

// ── Time helper ───────────────────────────────────────────────────────────
function calcDisplay(dep) {
  if (dep.canceled) return { text: 'Inställd', cls: 'cancel' };
  const dt   = new Date(dep.realtime || dep.scheduled);
  const mins = Math.round((dt - new Date()) / 60000);
  if (mins <= 0)  return { text: 'Nu',          cls: 'now'  };
  if (mins <= 2)  return { text: mins + ' min', cls: 'soon' };
  if (mins <= 59) return { text: mins + ' min', cls: ''     };
  return { text: dt.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }), cls: '' };
}

// ── Transport mode icons ───────────────────────────────────────────────────
const MODE_ICONS = {
  BUS: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="14" height="10" rx="2"/>
    <line x1="3" y1="8.5" x2="17" y2="8.5"/>
    <circle cx="6.5" cy="16" r="1.3"/>
    <circle cx="13.5" cy="16" r="1.3"/>
  </svg>`,
  TRAIN: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14 V6 a3 3 0 0 1 3-3 h6 a3 3 0 0 1 3 3 v8 z"/>
    <line x1="4" y1="9" x2="16" y2="9"/>
    <circle cx="7" cy="16.3" r="1.2"/>
    <circle cx="13" cy="16.3" r="1.2"/>
  </svg>`,
  METRO: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="14" height="10" rx="1"/>
    <line x1="8" y1="3" x2="8" y2="13"/>
    <line x1="12" y1="3" x2="12" y2="13"/>
    <circle cx="6.5" cy="16" r="1.2"/>
    <circle cx="13.5" cy="16" r="1.2"/>
  </svg>`,
  TRAM: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 1 L10 3.5 L13 1"/>
    <rect x="3" y="3.5" width="14" height="10" rx="1.5"/>
    <line x1="3" y1="8.5" x2="17" y2="8.5"/>
    <circle cx="6.5" cy="16.3" r="1.2"/>
    <circle cx="13.5" cy="16.3" r="1.2"/>
  </svg>`,
  BOAT: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12 L5 16 H15 L17 12 Z"/>
    <line x1="10" y1="12" x2="10" y2="3"/>
    <path d="M10 4 L15 8 H10 Z"/>
  </svg>`,
  TAXI: `<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="3" width="4" height="2" rx="0.5"/>
    <path d="M3 13 v-2.5 a1 1 0 0 1 .8-1 L6 8.5 h8 l2.2 1.5 a1 1 0 0 1 .8 1 V13 z"/>
    <circle cx="6.5" cy="14.5" r="1.3"/>
    <circle cx="13.5" cy="14.5" r="1.3"/>
  </svg>`,
};
function modeIcon(mode) {
  return MODE_ICONS[mode] || '';
}

// ── Delay delta + reason popover ───────────────────────────────────────────
function deltaInfo(dep) {
  if (dep.canceled || !dep.is_realtime) return null;
  const sec = dep.delay || 0;
  if (Math.abs(sec) < 60) return null;
  const mins = Math.round(sec / 60);
  const clock = new Date(dep.realtime || dep.scheduled)
    .toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
  return `${clock} (${mins > 0 ? '+' : ''}${mins})`;
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderAlerts(alerts) {
  return alerts.map(a => `
    <div class="alert-item">
      <div class="alert-title">${escapeHtml(a.title || 'Avvikelse')}</div>
      <div class="alert-text">${escapeHtml(a.text || '')}</div>
    </div>`).join('');
}

let popoverSeq = 0;

function toggleAlert(evt, id) {
  evt.stopPropagation();
  const el = document.getElementById(id);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  closeAllPopovers();
  if (!wasOpen) el.classList.add('open');
}

function closeAllPopovers() {
  document.querySelectorAll('.popover.open').forEach(p => p.classList.remove('open'));
}
document.addEventListener('click', closeAllPopovers);

// ── Metro line accent colors ────────────────────────────────────────────────
// Commonly-used approximations of SL's Blue/Red/Green line colors — not
// pulled from an official brand file, just widely-recognized. Buses and
// pendeltåg don't have a reliable per-line official color scheme, so they're
// left uncolored.
const METRO_LINE_COLORS = {
  '10': '#0087CB', '11': '#0087CB', // Blåa linjen
  '13': '#D71921', '14': '#D71921', // Röda linjen
  '17': '#148541', '18': '#148541', '19': '#148541', // Gröna linjen
};

// ── Platform / track ─────────────────────────────────────────────────────────
function platformOf(dep) {
  return dep.realtime_platform?.designation || dep.scheduled_platform?.designation || '';
}

// ── Stop rows (search results, recents, nearby) ─────────────────────────────
// <button> so rows are keyboard-focusable; name goes through data-* rather
// than an inline onclick string, so quotes/backslashes in names are safe.
function stopRow(s, sub) {
  return `<button type="button" class="result-item" data-id="${escapeHtml(s.extId)}" data-name="${escapeHtml(s.name)}">
    <span class="result-name">${escapeHtml(s.name)}</span>
    <span class="result-sub">${escapeHtml(sub)}</span>
  </button>`;
}

// ── Recent stops (localStorage) ─────────────────────────────────────────────
const RECENTS_KEY = 'tidtabell_recents_v1';

function loadRecents() {
  try { return JSON.parse(localStorage.getItem(RECENTS_KEY)) || []; }
  catch { return []; }
}

function saveRecent(stop) {
  let list = loadRecents().filter(s => s.extId !== stop.extId);
  list.unshift(stop);
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(list.slice(0, 8))); } catch {}
}

function renderRecents() {
  const list = loadRecents();
  if (!list.length) return '';
  return `<div class="recents-label">Senaste</div>` + list.map(s => stopRow(s, s.extId)).join('');
}

// ── Your location (setting) + nearby stops ──────────────────────────────────
const LOCATION_KEY = 'tidtabell_location_v1';

function loadLocation() {
  try { return JSON.parse(localStorage.getItem(LOCATION_KEY)); } catch { return null; }
}
function saveLocation(loc) {
  try { localStorage.setItem(LOCATION_KEY, JSON.stringify(loc)); } catch {}
}

function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('Geolocation stöds inte i den här webbläsaren')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => reject(new Error(geoErrorMessage(err))),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  });
}

function geoErrorMessage(err) {
  if (err.code === err.PERMISSION_DENIED)    return 'Platsåtkomst nekad';
  if (err.code === err.POSITION_UNAVAILABLE) return 'Din plats är inte tillgänglig just nu';
  if (err.code === err.TIMEOUT)              return 'Det tog för lång tid att hämta din plats';
  return 'Kunde inte hämta din plats';
}

function nearbyUpdateLink() {
  return `<button type="button" class="nearby-btn" onclick="findNearby(true)">
    <span>Uppdatera plats</span>
  </button>`;
}

function renderNearbyList(stops, nearLabel, footerHtml = '') {
  if (!stops.length) {
    return '<div class="state-msg">Inga hållplatser inom 300 m</div>' + footerHtml;
  }
  return `<div class="recents-label">${nearLabel}</div>` + stops.map(s => stopRow(s, s.dist + ' m')).join('') + footerHtml;
}

async function findNearby(forceRefresh) {
  const resultsEl = document.getElementById('searchResults');
  document.getElementById('stopBoard').innerHTML = '';
  resultsEl.innerHTML = '<div class="state-msg"><span class="dot-anim">Hämtar plats</span></div>';

  let loc = forceRefresh ? null : loadLocation();
  if (!loc) {
    try {
      loc = await getCurrentPosition();
      saveLocation(loc);
    } catch (e) {
      resultsEl.innerHTML = `<div class="state-msg">⚠ ${escapeHtml(e.message)}</div>`;
      return;
    }
  }

  resultsEl.innerHTML = '<div class="state-msg"><span class="dot-anim">Söker hållplatser</span></div>';
  try {
    const stops = await fetchNearby(loc.lat, loc.lon, 300);
    resultsEl.innerHTML = renderNearbyList(stops, 'Nära dig', nearbyUpdateLink());
  } catch (e) {
    resultsEl.innerHTML = `<div class="state-msg">⚠ ${escapeHtml(e.message)}</div>`;
  }
}

// ── Destination cleanup ───────────────────────────────────────────────────
function cleanDest(str = '') {
  return str
    .replace(/\s*\([^)]*\)/g, '')
    .replace(/ via .*/i, '')   // drop routing detail ("... via Golfvägen och Ekbacken") — a
                                // real board wouldn't show it, and it's what was pushing long
                                // destinations onto 4-5 lines on narrow phones
    .replace(/ T-bana$/i, '')
    .replace(/centralstation$/i, 'C')
    .replace(/ postterminal$/i, '')
    .trim();
}

// ── Repeat cap ────────────────────────────────────────────────────────────
// A frequent line (e.g. a pendeltåg line running every few minutes) would
// otherwise fill the whole board with repeats of itself. Keep at most
// MAX_PER_LINE departures per line+destination — enough to see "this one"
// and "the next one" — preserving chronological order.
function capRepeats(rows, limitPerKey) {
  const seen = new Map();
  return rows.filter(([num, dest]) => {
    const key = num + '|' + dest;
    const count = seen.get(key) || 0;
    if (count >= limitPerKey) return false;
    seen.set(key, count + 1);
    return true;
  });
}

// ── Build departure table ─────────────────────────────────────────────────
// walkMin: if given (home boards only), the first departure you can still
// reach in time is highlighted with a left accent.
function buildTable(rows, max, walkMin, stopId) {
  if (!rows.length) return '<div class="state-msg">Inga avgångar</div>';
  const lim    = max || MAX_ROWS;
  const sliced = capRepeats(rows, MAX_PER_LINE).slice(0, lim);
  // Only show the mode icon when this list actually mixes transport modes
  // (e.g. a searched hub stop) — on a single-mode board (every home board)
  // it would just repeat what the board header already says.
  const showIcons = new Set(sliced.map(([, , dep]) => dep.route?.transport_mode)).size > 1;
  const now    = new Date();
  const nowHr  = now.getHours() + now.getMinutes() / 60;
  const isLateEvening = nowHr >= 21 || nowHr < 3;
  let markedNext = false;

  const body = sliced.map(([num, dest, dep]) => {
    const { text, cls } = calcDisplay(dep);
    const icon  = showIcons ? modeIcon(dep.route?.transport_mode) : '';
    const alerts = dep.alerts || [];
    // Delayed: "12:07 (+3)". Cancelled: "Orsak" if the API gave a reason.
    const delta = dep.canceled ? (alerts.length ? 'Orsak' : null) : deltaInfo(dep);
    const plat  = platformOf(dep);

    let deltaHtml = '';
    if (delta) {
      if (alerts.length) {
        const id = `pop-${++popoverSeq}`;
        deltaHtml = `<button type="button" class="dep-delta" onclick="toggleAlert(event, '${id}')">${delta}</button>
          <div class="popover" id="${id}">${renderAlerts(alerts)}</div>`;
      } else {
        deltaHtml = `<span class="dep-delta">${delta}</span>`;
      }
    }

    const platHtml = plat ? `<span class="dep-platform">${escapeHtml(plat)}</span>` : '';

    // Heuristic only: "no more of this line in the next hour", based on
    // what's in the currently fetched 60-minute window — not a verified
    // "last of the day" (we can't see past that window).
    let lastHtml = '';
    if (isLateEvening && !dep.canceled) {
      const key = (dep.route?.designation || '') + '|' + (dep.route?.direction || '');
      const depTime = new Date(dep.realtime || dep.scheduled);
      const hasLater = rows.some(([, , other]) => {
        if (other === dep) return false;
        const otherKey = (other.route?.designation || '') + '|' + (other.route?.direction || '');
        if (otherKey !== key) return false;
        return new Date(other.realtime || other.scheduled) > depTime;
      });
      if (!hasLater) lastHtml = `<span class="dep-last">Inga fler inom en timme</span>`;
    }

    let rowClass = dep.canceled ? 'row-cancel' : '';
    if (walkMin != null && !dep.canceled) {
      const minsUntil = (new Date(dep.realtime || dep.scheduled) - now) / 60000;
      if (minsUntil >= walkMin && !markedNext) {
        rowClass = 'row-next';
        markedNext = true;
      }
    }

    const metroColor = dep.route?.transport_mode === 'METRO' ? METRO_LINE_COLORS[dep.route.designation] : null;
    const lineStyle = metroColor ? ` style="background:${metroColor};"` : '';

    // Tappable → map. Needs the queried stop id (for ResRobot lookup) and the
    // boarding stop's coordinates (fallback pin + which stop is "yours").
    const tap = (!dep.canceled && stopId && dep.stop?.lat != null)
      ? ` data-stop="${escapeHtml(stopId)}" data-line="${escapeHtml(dep.route?.designation)}" data-dir="${escapeHtml(dep.route?.direction)}" data-time="${escapeHtml(dep.scheduled)}" data-dest="${escapeHtml(dest)}" data-lat="${dep.stop.lat}" data-lon="${dep.stop.lon}" tabindex="0" role="button" aria-label="Visa rutt på karta"`
      : '';

    return `<tr class="${rowClass}"${tap}>
      <td class="col-line"><span class="line-num"${lineStyle}>${escapeHtml(num)}</span></td>
      <td>${icon ? `<span class="mode-icon" aria-hidden="true">${icon}</span>` : ''}<span class="dest-wrap"><span class="dest-text">${escapeHtml(dest)}</span>${platHtml}${lastHtml}</span></td>
      <td class="col-time"><span class="dep-time ${cls}">${text}</span>${deltaHtml}</td>
    </tr>`;
  }).join('');
  return `<table class="dep-table"><tbody>${body}</tbody></table>`;
}

// ── Home board filters ────────────────────────────────────────────────────
function busFilter(dep) {
  const dir = dep.route?.direction || '';
  const num = dep.route?.designation || '';
  return dir.includes('Odenplan') || dir.includes('Sundbyberg') ||
         (num === '509' && dir.includes('Tomteboda'));
}

function trainDest(dep) {
  const dir = dep.route?.direction || '';
  if (dir.includes('Uppsala') || dir.includes('Gävle'))  return 'Uppsala';
  if (dir.includes('Märsta') || dir.includes('Arlanda')) return 'Märsta';
  return 'Stockholm C';
}

// ── Fetch home boards ─────────────────────────────────────────────────────
// Show every departure in the next hour, capped to MAX_PER_LINE per
// line+destination so one frequent line doesn't crowd out the rest. If
// that leaves fewer than 5 rows, look further ahead (the API's window is a
// fixed 60 minutes, so this means re-querying with a later `time`) until
// there are at least 5 (post-cap), or give up.
async function fetchHomeBoardRows(stopId, filterFn, mapFn) {
  const deps = await fetchDepartures(stopId);
  let rows = capRepeats(deps.filter(filterFn).map(mapFn), MAX_PER_LINE);
  if (rows.length >= 5) return rows.slice(0, 5);

  let cursor = new Date();
  for (let i = 0; i < 4 && rows.length < 5; i++) {
    cursor = new Date(cursor.getTime() + 60 * 60000);
    let more;
    try {
      more = await fetchDepartures(stopId, apiTimeParam(cursor));
    } catch {
      break;
    }
    rows = capRepeats(rows.concat(more.filter(filterFn).map(mapFn)), MAX_PER_LINE);
  }
  return rows.slice(0, 5);
}

function apiTimeParam(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// On a failed refresh, keep the last good board (dimmed, with a note) instead
// of wiping it — a glance at a stale board beats a bare error.
// ponytail: in-memory only, so offline first load after a reload still shows the error.
const lastGood = {};

async function loadHomeBoard(elId, stopId, filterFn, mapFn, walkMin) {
  const el = document.getElementById(elId);
  try {
    const rows = await fetchHomeBoardRows(stopId, filterFn, mapFn);
    const html = buildTable(rows, rows.length, walkMin, stopId);
    lastGood[elId] = { html, at: new Date() };
    el.innerHTML = html;
  } catch (e) {
    const g = lastGood[elId];
    el.innerHTML = g
      ? `<div class="stale-note">⚠ Uppdaterad ${g.at.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })} · ${escapeHtml(e.message)}</div><div class="stale">${g.html}</div>`
      : `<div class="state-msg">⚠ ${escapeHtml(e.message)}</div>`;
  }
}

function fetchAll() {
  loadHomeBoard(
    'busBoard', VASALUND_ID,
    d => d.route?.transport_mode === 'BUS' && busFilter(d),
    d => {
      const num  = d.route.designation;
      const dest = (num === '509' && (d.route.direction||'').includes('Tomteboda')) ? 'Solna C' : cleanDest(d.route.direction);
      return [num, dest, d];
    },
    WALK.vasalund
  );

  loadHomeBoard(
    'trainBoard', SOLNA_ID,
    d => d.route?.transport_mode === 'TRAIN',
    d => [d.route.designation, trainDest(d), d],
    WALK.solna
  );

  loadHomeBoard(
    'metroBoard', SOLNA_C_ID,
    d => d.route?.transport_mode === 'METRO',
    d => [d.route.designation, cleanDest(d.route.direction), d],
    WALK.solnac
  );

  startCountdown();
}

// ── Countdown / arc ───────────────────────────────────────────────────────
const CIRC = 43.98;

function startCountdown() {
  clearInterval(timer);
  countdown = REFRESH_SEC;
  updateArc();
  timer = setInterval(() => {
    countdown--;
    updateArc();
    if (countdown <= 0) { clearInterval(timer); fetchAll(); }
  }, 1000);
}
function updateArc() {
  document.getElementById('progressArc').style.strokeDashoffset =
    CIRC * (1 - countdown / REFRESH_SEC);
}

// Stop polling while the tab is hidden; refresh immediately on return.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) clearInterval(timer);
  else fetchAll();
});

// ── Board collapse (persisted) ────────────────────────────────────────────
const COLLAPSED_KEY = 'tidtabell_collapsed_v1';

function initBoardToggles() {
  let state = {};
  try { state = JSON.parse(localStorage.getItem(COLLAPSED_KEY)) || {}; } catch {}
  document.querySelectorAll('.board-head[data-board]').forEach(head => {
    const board = head.parentElement;
    const apply = collapsed => {
      board.classList.toggle('collapsed', collapsed);
      head.setAttribute('aria-expanded', String(!collapsed));
    };
    apply(!!state[head.dataset.board]);
    head.addEventListener('click', () => {
      const collapsed = !board.classList.contains('collapsed');
      apply(collapsed);
      state[head.dataset.board] = collapsed;
      try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify(state)); } catch {}
    });
  });
}

// ── View switching ────────────────────────────────────────────────────────
// Search is a history entry so the phone's back gesture / Esc closes it
// instead of leaving the page.
function showSearch() {
  history.pushState({ search: true }, '');
  openSearch();
}

function goBack() {
  if (history.state?.search) history.back(); // popstate closes the view
  else closeSearch();
}

// State is { search, map }. The map sheet sits on top of whatever view opened
// it, so leaving it must not re-open (and reset) the search view underneath.
window.addEventListener('popstate', () => {
  const st = history.state || {};
  setMapVisible(!!st.map);
  if (st.map) return;
  const searchHidden = document.getElementById('searchView').classList.contains('hidden');
  if (st.search && searchHidden) openSearch();
  else if (!st.search && !searchHidden) closeSearch();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches?.('tr[data-stop]')) { openMap(e.target.dataset); return; }
  if (e.key !== 'Escape') return;
  if (!document.getElementById('mapSheet').hidden) history.back();
  else if (!document.getElementById('searchView').classList.contains('hidden')) goBack();
});

document.addEventListener('click', e => {
  if (e.target.closest('.dep-delta, .popover')) return;
  const row = e.target.closest('tr[data-stop]');
  if (row) openMap(row.dataset);
});

// ── Route map (Leaflet + OpenStreetMap) ───────────────────────────────────
let map = null, mapLayer = null, mapSeq = 0;

function setMapVisible(on) {
  document.getElementById('mapSheet').hidden = !on;
  if (!on) mapSeq++; // drop any in-flight route response
}

async function openMap(d) {
  history.pushState({ search: !!history.state?.search, map: true }, '');
  setMapVisible(true);
  const msg = document.getElementById('mapMsg');
  document.getElementById('mapLine').textContent = d.line;
  document.getElementById('mapDest').textContent = d.dest;
  if (!window.L) { msg.textContent = 'Kartan kunde inte laddas'; return; }

  const here = [+d.lat, +d.lon];
  if (!map) {
    map = L.map('map');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);
    mapLayer = L.layerGroup().addTo(map);
  }
  mapLayer.clearLayers();
  map.invalidateSize();
  map.setView(here, 15);
  const hereMarker = L.circleMarker(here, { radius: 9, color: '#0A0A0A', weight: 3, fillColor: '#F5F4EF', fillOpacity: 1 })
    .addTo(mapLayer);
  msg.textContent = 'Hämtar rutt…';

  const seq = ++mapSeq;
  let stops = [];
  try {
    const qs = new URLSearchParams({ stop: d.stop, line: d.line, dir: d.dir, time: d.time });
    const r = await fetch(`${PROXY_BASE}/journey?${qs}`);
    if (r.ok) stops = (await r.json()).stops || [];
  } catch {}
  if (seq !== mapSeq) return;

  if (stops.length < 2) { msg.textContent = 'Kunde inte hitta rutten'; return; }
  msg.textContent = '';

  // "Yours" = the stop nearest the departure's boarding coordinates.
  const dist = s => (s.lat - here[0]) ** 2 + (s.lon - here[1]) ** 2;
  const idx = stops.reduce((best, s, i) => dist(s) < dist(stops[best]) ? i : best, 0);
  const pts = stops.map(s => [s.lat, s.lon]);
  const label = s => escapeHtml(s.time ? `${s.name} ${s.time}` : s.name);
  hereMarker.bindTooltip(label(stops[idx]), { permanent: true, direction: 'top' });

  L.polyline(pts.slice(0, idx + 1), { color: '#999', weight: 4, dashArray: '6 8' }).addTo(mapLayer);
  L.polyline(pts.slice(idx), { color: '#0A0A0A', weight: 5 }).addTo(mapLayer);
  stops.forEach((s, i) => {
    if (i === idx) return;
    const ahead = i > idx;
    L.circleMarker(pts[i], { radius: 4, color: '#0A0A0A', weight: 2, fillColor: ahead ? '#F5F4EF' : '#ccc', fillOpacity: 1 })
      .bindTooltip(label(s), { direction: 'top' })
      .addTo(mapLayer);
  });
  L.marker(pts[stops.length - 1]).bindTooltip(label(stops[stops.length - 1]), { permanent: true, direction: 'top' })
    .addTo(mapLayer);
  map.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
}

function openSearch() {
  document.getElementById('mainView').classList.add('hidden');
  document.getElementById('searchView').classList.remove('hidden');
  document.getElementById('backBtn').classList.add('visible');
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').hidden = true;
  searchSeq++;
  document.getElementById('searchResults').innerHTML = renderRecents();
  document.getElementById('stopBoard').innerHTML = '';
  document.getElementById('searchInput').focus();
}

function closeSearch() {
  document.getElementById('searchView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  document.getElementById('backBtn').classList.remove('visible');
}

// ── Stop search ───────────────────────────────────────────────────────────
let searchSeq = 0; // bumps on every keystroke; a slow older response sees a newer seq and drops itself

function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  onSearchInput();
  input.focus();
}

function onSearchInput() {
  clearTimeout(searchTimer);
  searchSeq++;
  const q = document.getElementById('searchInput').value.trim();
  document.getElementById('clearBtn').hidden = !document.getElementById('searchInput').value;
  document.getElementById('stopBoard').innerHTML = '';
  if (!q) { document.getElementById('searchResults').innerHTML = renderRecents(); return; }
  document.getElementById('searchResults').innerHTML =
    '<div class="state-msg"><span class="dot-anim">Söker</span></div>';
  searchTimer = setTimeout(() => doSearch(q), 380);
}

async function doSearch(q) {
  const seq = ++searchSeq;
  try {
    const stops = await searchStops(q);
    if (seq !== searchSeq) return;
    if (!stops.length) {
      document.getElementById('searchResults').innerHTML =
        '<div class="state-msg">Inga hållplatser hittades</div>';
      return;
    }
    document.getElementById('searchResults').innerHTML = stops.map(s => stopRow(s, s.extId)).join('');
  } catch(e) {
    document.getElementById('searchResults').innerHTML =
      `<div class="state-msg">⚠ ${escapeHtml(e.message)}</div>`;
  }
}

// ── Departures for searched stop ──────────────────────────────────────────
async function showStopDepartures(extId, name) {
  saveRecent({ extId, name });
  document.getElementById('searchResults').innerHTML = '';
  document.getElementById('stopBoard').innerHTML = `
    <div class="board">
      <div class="board-head">
        <span class="board-name">${escapeHtml(name)}</span>
      </div>
      <div id="dynBoard"><div class="state-msg"><span class="dot-anim">Hämtar</span></div></div>
    </div>`;

  const el = document.getElementById('dynBoard'); // captured: view may change while fetching
  try {
    const deps = await fetchDepartures(extId);
    const rows = deps.map(d => [
      d.route?.designation || '?',
      cleanDest(d.route?.direction),
      d
    ]);
    el.innerHTML = buildTable(rows, 8, undefined, extId);
  } catch(e) {
    el.innerHTML = `<div class="state-msg">⚠ ${escapeHtml(e.message)}</div>`;
  }
}


// ── Auto-update ──────────────────────────────────────────────────────────
// This page is a static file on GitHub Pages — a tab left open never
// re-downloads it on its own. Periodically HEAD-check the page's own
// Last-Modified/ETag (cache-busted so the CDN can't serve a stale answer)
// and reload once a newer deploy shows up. Skipped while typing in search,
// so it can't yank the page out from under you mid-lookup.
const UPDATE_CHECK_MS = 5 * 60 * 1000;
let deployedVersion = null;

async function checkForUpdate() {
  try {
    const r = await fetch(`${location.pathname}?v=${Date.now()}`, { method: 'HEAD', cache: 'no-store' });
    const version = r.headers.get('etag') || r.headers.get('last-modified');
    if (!version) return;
    if (deployedVersion === null) { deployedVersion = version; return; }
    if (version === deployedVersion) return;

    const searching = !document.getElementById('searchView').classList.contains('hidden')
      && document.activeElement === document.getElementById('searchInput');
    if (searching) return; // try again next cycle instead of interrupting

    location.reload();
  } catch (e) { /* offline or blocked — just try again next cycle */ }
}
setInterval(checkForUpdate, UPDATE_CHECK_MS);
checkForUpdate();

// ── Boot ──────────────────────────────────────────────────────────────────
if (history.state?.search || history.state?.map) history.replaceState(null, ''); // reload lands on main view
document.getElementById('searchResults').addEventListener('click', e => {
  const row = e.target.closest('.result-item');
  if (row) showStopDepartures(row.dataset.id, row.dataset.name);
});
initBoardToggles();
fetchAll();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
